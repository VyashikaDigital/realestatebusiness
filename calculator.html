<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mortgage Calculator | Summit &amp; Oak Realty</title><meta name="description" content="Estimate your monthly payment and how much home you can afford."><meta name="theme-color" content="#071214">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header id="hdr"></header><main><section class="w" style="padding:40px 20px 80px"><h1 data-t style="font-size:clamp(30px,5vw,48px)">Mortgage calculator</h1><p class="sp" style="margin:8px 0 24px">Principal and interest only. Taxes, insurance and HOA are extra.</p><div class="two">
<div class="panel"><h2 style="font-size:24px;margin-bottom:12px">Monthly payment</h2><div class="row"><div><label for="cp">Home price ($)</label><input id="cp" type="number" value="450000" min="0"></div><div><label for="cd">Down payment (%)</label><input id="cd" type="number" value="20" min="0" max="100"></div></div><div class="row"><div><label for="cr">Interest rate (%)</label><input id="cr" type="number" value="6.5" step="0.05" min="0"></div><div><label for="cy">Term</label><select id="cy"><option value="30">30 years</option><option value="20">20 years</option><option value="15">15 years</option></select></div></div>
<div class="sp">Estimated payment</div><div class="out" id="cout"></div><div class="sp" id="cnote"></div><div class="donut" id="dn" role="img" aria-label="Principal versus interest"></div><div class="sp" id="dnote"></div></div>
<div class="panel"><h2 style="font-size:24px;margin-bottom:12px">How much can I afford?</h2><div class="row"><div><label for="ai">Annual income ($)</label><input id="ai" type="number" value="110000" min="0"></div><div><label for="ad">Monthly debts ($)</label><input id="ad" type="number" value="400" min="0"></div></div><div class="row"><div><label for="ao">Cash for down payment ($)</label><input id="ao" type="number" value="90000" min="0"></div><div><label for="ar">Rate (%)</label><input id="ar" type="number" value="6.5" step="0.05" min="0"></div></div><div class="sp">Estimated price range</div><div class="out" id="aout"></div><div class="sp">Uses the 28% housing and 36% total debt guidelines, 30-year loan. A lender will give you an exact figure.</div></div></div></section></main><footer id="ftr"></footer><script src="common.js"></script><script>const p=new URLSearchParams(location.search).get("p");if(p)$("cp").value=+p;
function calc(){const P=+$("cp").value||0,d=Math.min(Math.max(+$("cd").value||0,0),100),r=(+$("cr").value||0)/1200,n=+$("cy").value*12,B=P*(1-d/100),m=r?B*r/(1-Math.pow(1+r,-n)):B/n,t=m*n,pp=t?Math.round(B/t*100):100;
 $("cout").textContent=money(m)+"/mo";$("cnote").textContent="Loan amount "+money(B)+" with "+money(P-B)+" down.";$("dn").style.background="conic-gradient(var(--amber) 0 "+pp+"%,rgba(255,255,255,.18) 0)";$("dnote").textContent="Principal "+pp+"%, interest "+(100-pp)+"% over the full term."}
function aff(){const i=(+$("ai").value||0)/12,pm=Math.max(0,Math.min(i*.28,i*.36-(+$("ad").value||0))),r=(+$("ar").value||0)/1200,n=360,loan=r?pm*(1-Math.pow(1+r,-n))/r:pm*n,mx=loan+(+$("ao").value||0);$("aout").textContent=money(mx*.9)+" to "+money(mx)}
["cp","cd","cr","cy"].forEach(i=>$(i).addEventListener("input",calc));["ai","ad","ao","ar"].forEach(i=>$(i).addEventListener("input",aff));calc();aff();</script></body></html>
