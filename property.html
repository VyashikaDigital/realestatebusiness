<!DOCTYPE html><html lang="en-US"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Details | Summit &amp; Oak Realty</title><meta name="description" content="View photos, details, estimated payment and book a tour."><meta name="theme-color" content="#071214">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header id="hdr"></header><main><section class="w" id="pg" style="padding:30px 20px 80px"><p class="sp">Loading property...</p></section></main><footer id="ftr"></footer><script src="common.js"></script><script>const POOL=["1556909114-f6e7ad7d3136","1586023492125-27b2c045efd7","1522771739844-6a9f6d5f14af","1584622650111-993a426fbf0a"];
loadData().then(()=>{const x=L.find(v=>v.id===+new URLSearchParams(location.search).get("id")),pg=$("pg");
 if(!x){pg.innerHTML=`<div class="empty"><h2>Property not found</h2><p class="sp" style="margin:8px 0 14px">It may have been sold or removed.</p><a class="btn" href="listings.html">Browse all homes</a></div>`;return}
 document.title=x.t+" | Summit & Oak Realty";const gal=[x.i,...POOL].filter(Boolean);
 const pay=x.m==="buy"?(()=>{const P=x.p*.8,r=.065/12,n=360;return P*r/(1-Math.pow(1+r,-n))})():0;
 const sim=L.filter(v=>v.id!==x.id&&(v.c===x.c||v.m===x.m)).slice(0,3);
 pg.innerHTML=`<p class="sp"><a href="index.html">Home</a> / <a href="listings.html?m=${x.m}">${x.m==="buy"?"Buy":"Rent"}</a> / ${x.t}</p>
 <div class="two" style="margin-top:14px"><div><div class="gal"><img id="gm" src="${imgUrl(gal[0],1200)}" alt="${x.t}" onerror="fb(this,${x.h})"></div><div class="thumbs">${gal.map((g,i)=>`<button data-g="${g}" aria-label="Photo ${i+1}"><img src="${imgUrl(g,200)}" alt="" onerror="this.parentNode.hidden=true"></button>`).join("")}</div><p class="sp" style="margin-top:6px">Interior photos are sample images.</p></div>
 <div><span class="tag" style="position:static;display:inline-block">${x.m==="buy"?"For sale":"For rent"}</span><h1 style="font-size:clamp(28px,4vw,42px);margin:10px 0 4px">${x.t}</h1><div class="sp">${x.c} &middot; ${x.y}</div><div class="pr" style="font-size:34px;margin:10px 0">${price(x)}</div>
 <div class="specs"><div><b>${x.b}</b><span>Beds</span></div><div><b>${x.ba}</b><span>Baths</span></div><div><b>${x.s.toLocaleString("en-US")}</b><span>Sq ft</span></div></div>
 <p style="margin:14px 0">${x.n}</p>${x.m==="buy"?`<p class="sp">Estimated payment with 20% down: <b>${money(pay)}/mo</b> (6.5%, 30 years). <a href="calculator.html?p=${x.p}">Adjust in the calculator</a></p>`:""}
 <button class="chip" id="sv" aria-pressed="${saved.has(x.id)}" style="margin-top:12px">${saved.has(x.id)?"Saved":"Save this home"}</button></div></div>
 <div class="two" style="margin-top:30px"><form class="panel" id="tf"><h2 style="font-size:26px;margin-bottom:12px">Schedule a tour</h2><div class="row"><div><label for="tn">Full name</label><input id="tn" required></div><div><label for="tp">Phone</label><input id="tp" type="tel" required></div></div><div style="margin-bottom:10px"><label for="td">Preferred date</label><input id="td" type="date" required></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-ch="wa">Request on WhatsApp</button><button class="btn alt" data-ch="em">Request by email</button></div><p class="ok" id="to" role="status"></p></form>
 <iframe class="mapf" style="height:100%;min-height:300px" title="Map of ${x.c}" loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(x.c)}&z=11&output=embed"></iframe></div>
 <h2 style="font-size:28px;margin:40px 0 14px">Similar homes</h2><div class="grid" id="sim">${sim.map(v=>card(v)).join("")}</div>`;
 $("td").min=new Date().toISOString().slice(0,10);
 pg.addEventListener("click",e=>{const g=e.target.closest("[data-g]");if(g)$("gm").src=imgUrl(g.dataset.g,1200);if(e.target.id==="sv"){saved.has(x.id)?saved.delete(x.id):saved.add(x.id);store();e.target.setAttribute("aria-pressed",saved.has(x.id));e.target.textContent=saved.has(x.id)?"Saved":"Save this home";$("savedNav").textContent="Saved ("+saved.size+")"}favClick(e)});
 $("tf").addEventListener("submit",e=>{e.preventDefault();sendForm($("tn").value,$("tp").value,"I'd like to tour "+x.t+" ("+x.c+", "+price(x)+") on "+$("td").value+".",e.submitter.dataset.ch,$("to"))});
});</script></body></html>
